name: agent-release

on:
  push:
    tags: ['agent-v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache-dependency-path: agent/go.sum
      - name: Build (copies plugin/ into the embed folder and fails if it differs)
        shell: pwsh
        run: ./build.ps1 -Version ("${{ github.ref_name }}" -replace '^agent-v', '')
      - name: Test
        shell: pwsh
        run: go vet ./... ; if ($LASTEXITCODE -eq 0) { go test ./... }
      - name: Checksums
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/exponential-agent.exe -Algorithm SHA256).Hash.ToLower()
          "$h  exponential-agent.exe" | Out-File -Encoding ascii -NoNewline dist/SHA256SUMS
          Add-Content -Encoding ascii dist/SHA256SUMS ""
      - name: Sign checksums
        shell: bash
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          if [ -z "$AGENT_SIGNING_KEY" ]; then echo "AGENT_SIGNING_KEY secret is empty, refusing to publish an unsigned release"; exit 1; fi
          node -e "const c=require('crypto'),fs=require('fs');const k=c.createPrivateKey(process.env.AGENT_SIGNING_KEY);const d=fs.readFileSync('dist/SHA256SUMS');const sig=c.sign(null,d,k);if(!c.verify(null,d,c.createPublicKey(k),sig))process.exit(1);fs.writeFileSync('dist/SHA256SUMS.sig',sig.toString('base64'))"
          test -s dist/SHA256SUMS.sig
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/exponential-agent.exe dist/SHA256SUMS dist/SHA256SUMS.sig --title "Exponential agent ${{ github.ref_name }}" --generate-notes --latest
