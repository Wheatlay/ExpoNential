name: agent-release

on:
  push:
    tags: ['agent-v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache-dependency-path: agent/go.sum
      - name: Test
        shell: pwsh
        run: go vet ./... ; if ($LASTEXITCODE -eq 0) { go test ./... }
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Version ("${{ github.ref_name }}" -replace '^agent-v', '')
      - name: Checksums
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/exponential-agent.exe -Algorithm SHA256).Hash.ToLower()
          "$h  exponential-agent.exe" | Out-File -Encoding ascii -NoNewline dist/SHA256SUMS
          Add-Content -Encoding ascii dist/SHA256SUMS ""
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/exponential-agent.exe dist/SHA256SUMS --title "Exponential agent ${{ github.ref_name }}" --generate-notes --latest
