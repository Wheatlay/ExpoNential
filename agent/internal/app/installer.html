<!DOCTYPE html>
<html data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<style>
:root {
  --bg: #0f1012; --line: #23252a; --line2: #31333a; --sec: #1a1b1f;
  --fg: #f7f8f8; --fg2: #c9ccd3; --mut: #8a8f98; --acc: #5e6ad2; --acc-h: #7180ff; --ok: #4cb782; --err: #eb5757; --warn: #f2994a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default;
  font: 14px/1.5 Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
.body { height: 100%; padding: 26px 30px 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 18px; }
.h { font-size: 22px; font-weight: 600; margin: 0; }
.pair { display: flex; align-items: center; justify-content: center; gap: 18px; height: 76px; }
.tile { width: 76px; height: 76px; border-radius: 18px; display: grid; place-items: center; background: var(--sec); border: 1px solid var(--line2); color: var(--mut); }
.tile img { width: 46px; height: 46px; }
.tile svg { width: 44px; height: 44px; }
.dots { display: flex; gap: 6px; width: 48px; justify-content: center; align-items: center; color: var(--mut); }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: block; }
.dots.run i { animation: pulse 1.2s ease-in-out infinite; }
.dots.run i:nth-child(2) { animation-delay: .2s; }
.dots.run i:nth-child(3) { animation-delay: .4s; }
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; background: var(--acc-h); } }
@media (prefers-reduced-motion: reduce) { .dots.run i { animation: none; opacity: .6; } }
.sym { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; font-weight: 700; line-height: 1; flex-shrink: 0; }
.sym.ok { background: rgba(76,183,130,.18); color: var(--ok); }
.sym.err { background: rgba(235,87,87,.18); color: var(--err); }
.who { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; color: var(--fg2); flex-wrap: wrap; }
.who b { color: var(--fg); font-weight: 500; }
.av { width: 30px; height: 30px; border-radius: 50%; background: #e0457b; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; flex-shrink: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--line2); font-size: 13px; color: var(--fg2); }
.chip img { width: 16px; height: 16px; }
.chip svg { width: 16px; height: 16px; }
.chip.amber { color: var(--warn); border-color: var(--warn); }
.chip.on { color: var(--ok); border-color: var(--ok); }
.chip.off { color: var(--mut); }
.chk { display: flex; align-items: center; gap: 10px; color: var(--fg2); font-size: 14px; cursor: pointer; }
.chk input { display: none; }
.box { width: 18px; height: 18px; border-radius: 3px; border: 1px solid var(--line2); display: grid; place-items: center; color: #fff; font-size: 12px; line-height: 1; }
.chk input:checked + .box { background: var(--acc); border-color: var(--acc); }
.chk input:checked + .box::after { content: "\2713"; }
.actions { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }
button { height: 38px; padding: 0 22px; border-radius: 8px; border: 1px solid var(--line2); background: transparent; color: var(--fg); font: 500 14px Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; cursor: pointer; }
button:hover { background: var(--sec); }
button.p { background: var(--acc); border-color: var(--acc); color: #fff; }
button.p:hover { background: var(--acc-h); border-color: var(--acc-h); }
button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
button.danger:hover { filter: brightness(1.1); }
button:focus-visible { outline: 2px solid var(--acc-h); outline-offset: 2px; }
.mut { color: var(--mut); font-size: 13px; max-width: 400px; word-break: break-word; }
.mut.warn { color: var(--warn); }
.tip { display: flex; align-items: center; justify-content: center; gap: 8px; }
.tm { width: 18px; height: 18px; flex-shrink: 0; }
.steplist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; text-align: left; font-size: 14px; width: 330px; }
.steplist li { display: flex; align-items: center; gap: 10px; height: 22px; color: var(--fg2); white-space: nowrap; }
.steplist li.now { color: var(--fg); }
.steplist li.err { color: var(--err); }
.steplist li.skip { color: var(--mut); }
.steplist .ri { width: 16px; height: 16px; flex-shrink: 0; display: grid; place-items: center; }
.steplist .ri img, .steplist .ri svg { width: 16px; height: 16px; }
.steplist .nt { color: var(--mut); font-size: 13px; }
.steplist li.err .ic::before { content: "\2715"; color: var(--err); font-weight: 700; }
.steplist li.skip .ic::before { content: "\2013"; color: var(--mut); }
.steplist .ic { width: 18px; height: 18px; display: grid; place-items: center; flex-shrink: 0; }
.steplist li.ok .ic::before { content: "\2713"; color: var(--ok); font-weight: 700; }
.steplist li.now .ic::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line2); border-top-color: var(--acc-h); animation: sp 0.8s linear infinite; }
@media (prefers-reduced-motion: reduce) { .steplist li.now .ic::before { animation: none; } }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line2); border-top-color: var(--acc-h); animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.sel { height: 32px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line2); background: var(--sec); color: var(--fg); font: inherit; font-size: 13px; max-width: 360px; }
.plist { display: flex; flex-direction: column; gap: 2px; width: 340px; max-height: 140px; overflow-y: auto; text-align: left; }
.prow { display: flex; align-items: center; gap: 10px; height: 28px; cursor: pointer; color: var(--fg2); font-size: 13px; flex-shrink: 0; }
.prow span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow:focus-visible { outline: 2px solid var(--acc-h); outline-offset: 1px; }
.sw { flex: none; width: 32px; height: 18px; border-radius: 9999px; background: var(--sec); border: 1px solid var(--line2); position: relative; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--mut); transition: transform .15s, background .15s; }
.prow.on .sw { background: var(--acc); border-color: var(--acc); }
.prow.on .sw::after { transform: translateX(14px); background: #fff; }
@media (prefers-reduced-motion: reduce) { .sw, .sw::after { transition: none; } }
.pill { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 9999px; font-size: 11px; font-weight: 500; border: 1px solid var(--line2); color: var(--mut); white-space: nowrap; flex: none; }
.pill.good { color: var(--ok); border-color: var(--ok); }
button.sm { height: 28px; padding: 0 12px; font-size: 13px; }
/*{{CSS}}*/
:root[data-theme] { --bg: var(--bg-primary); --line: var(--border-primary); --line2: var(--border-secondary); --sec: var(--bg-secondary);
  --fg: var(--text-primary); --fg2: var(--text-secondary); --mut: var(--text-tertiary); --acc: var(--accent); --acc-h: var(--accent-hover);
  --ok: var(--success); --err: var(--danger); --warn: var(--warning); }
</style>
</head>
<body>
<div class="body" id="app"></div>
<script>
var S = {
  pl: {
    autostart: "Startuje z Windows", cancel: "Anuluj", go: "Połącz",
    lv: ["", "Dostęp do zgłoszeń w Claude Code", "Ślad pracy", "Agent w tle"], lvCodex1: "Dostęp do zgłoszeń w Codex",
    done: "Gotowe", doneErr: "Gotowe z błędami", doneWarn: "Serwer jeszcze nie potwierdził agenta.",
    trayTip: "Ikona Exponential obok zegara pokazuje, co robi agent.",
    onlyClaude: "tylko Claude Code",
    nf: "nie znaleziono na tym komputerze", term: "Terminal",
    phoneQ: "Uruchamiać zadania z telefonu?", yes: "Tak", notNow: "Nie teraz", phoneHint: "To samo konto co w aplikacji Claude na telefonie", phoneNone: "—",
    phoneReady: "Gotowe", phoneSetup: "Wymaga przygotowania", phonePrep: "Przygotuj", phoneTrust: "folder nie jest zaufany", phoneOnboarding: "konto nie ukończyło pierwszego uruchomienia", phoneFolder: "brak folderu",
    phoneChange: "Zmienisz to w Ustawieniach agenta → Start z telefonu",
    close: "Zamknij", open: "Otwórz Exponential", on: "● działa", off: "○ nie działa", disconnect: "Odłącz",
    uninstallQ: "Odinstalować agenta?", uninstallGo: "Odinstaluj", uninstalling: "Odinstalowuję…",
    removeWarn: "Nie udało się wyrejestrować komputera z serwera. Usuń go w Ustawieniach > AI.", removed: "Odłączono", removedLine: "Agent został usunięty z tego komputera.", account: "twoje konto",
    err: {
      ratelimit: ["Za dużo prób", "Spróbuj ponownie za minutę."],
      expired: ["Link wygasł", "Pobierz agenta jeszcze raz w Exponential."],
      notrailer: ["Pobierz agenta w Exponential", "Ten plik nie jest połączony z kontem. Pobierz go w Ustawieniach."],
      badurl: ["Zły adres serwera", ""], network: ["Brak połączenia z serwerem", ""], http: ["Nie udało się połączyć", ""],
      install: ["Instalacja nie powiodła się", ""], start: ["Nie udało się uruchomić agenta", ""], exe: ["Błąd", ""]
    }
  },
  en: {
    autostart: "Starts with Windows", cancel: "Cancel", go: "Connect",
    lv: ["", "Issue access in Claude Code", "Work trace", "Background agent"], lvCodex1: "Issue access in Codex",
    done: "Done", doneErr: "Done with errors", doneWarn: "The server has not confirmed the agent yet.",
    trayTip: "The Exponential icon next to the clock shows what the agent is doing.",
    onlyClaude: "Claude Code only",
    nf: "not found on this computer", term: "Terminal",
    phoneQ: "Start tasks from your phone?", yes: "Yes", notNow: "Not now", phoneHint: "The same account as in the Claude app on your phone", phoneNone: "—",
    phoneReady: "Ready", phoneSetup: "Needs setup", phonePrep: "Prepare", phoneTrust: "folder not trusted", phoneOnboarding: "account has not finished first-run setup", phoneFolder: "folder missing",
    phoneChange: "Change it in agent Settings → Start from phone",
    close: "Close", open: "Open Exponential", on: "● running", off: "○ not running", disconnect: "Disconnect",
    uninstallQ: "Uninstall the agent?", uninstallGo: "Uninstall", uninstalling: "Uninstalling…",
    removeWarn: "Could not unregister this computer from the server. Remove it in Settings > AI.", removed: "Disconnected", removedLine: "The agent was removed from this computer.", account: "your account",
    err: {
      ratelimit: ["Too many attempts", "Try again in a minute."],
      expired: ["Link expired", "Download the agent again in Exponential."],
      notrailer: ["Download the agent in Exponential", "This file is not linked to an account. Download it in Settings."],
      badurl: ["Bad server address", ""], network: ["Cannot reach the server", ""], http: ["Could not connect", ""],
      install: ["Installing failed", ""], start: ["Could not start the agent", ""], exe: ["Error", ""]
    }
  }
};
var MARKP = '<path d="M2 22 C10 22 14 21 18 14 C20 10 21 6 22 3 L22 22 Z" fill="#5e6ad2"/><path d="M2 22 C10 22 14 21 18 14 C20 10 21 6 22 3" fill="none" stroke="#7180ff" stroke-width="1.6"/>';
var MARK = '<svg viewBox="0 0 26 26" aria-hidden="true">' + MARKP + '</svg>';
var TRAYMARK = '<svg class="tm" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="4" fill="#1a1b1f" stroke="#31333a"/><path d="M3 12.5 C6.5 12.5 8.5 12 10.5 8.5 C11.5 6.5 12 4.5 12.5 3 L12.5 12.5 Z" fill="#5e6ad2"/></svg>';
var GLYPH_AI = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L13.8 9.2 L20 11 L13.8 12.8 L12 19 L10.2 12.8 L4 11 L10.2 9.2 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
var GLYPH_APP = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 6.5 L6.5 8 L4.5 9.5 M8 9.5 H11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var T = S.en, app = document.getElementById("app"), cur = {};

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function engName() { return cur.engine === "codex" ? "Codex" : "Claude Code"; }
function safeIcon(u) { return typeof u === "string" && u.indexOf("data:image/png;base64,") === 0 ? u : ""; }
// the pair header: AI tile, middle (dots / check / !), Exponential tile
function pair(mid) {
  var ic = cur.engineFound ? safeIcon(cur.engineIcon) : "";
  var ai = ic ? '<img src="' + ic + '" alt="">' : GLYPH_AI;
  var m = mid === "run" ? '<span class="dots run"><i></i><i></i><i></i></span>' :
    mid === "ok" ? '<span class="sym ok">✓</span>' :
    mid === "err" ? '<span class="sym err">!</span>' : '<span class="dots"><i></i><i></i><i></i></span>';
  return '<div class="pair"><span class="tile">' + ai + '</span>' + m + '<span class="tile"><svg viewBox="0 0 26 26" aria-hidden="true">' + MARKP + '</svg></span></div>';
}
function chip() {
  if (!cur.engineFound) return '<span class="chip amber">' + esc(T.nf) + '</span>';
  var src = cur.engineSrc, hi = safeIcon(cur.hostIcon);
  var name = src === "PATH" || !src ? T.term : src;
  return '<span class="chip">' + (hi ? '<img src="' + hi + '" alt="">' : GLYPH_APP) + esc(name) + '</span>';
}
function who(right) {
  var n = cur.user || T.account;
  return '<div class="who"><span class="av">' + esc(n.charAt(0).toUpperCase()) + '</span><span><b>' + esc(n) + '</b> · ' + esc(cur.host) + '</span>' + right + '</div>';
}
function title() { return '<p class="h">' + esc(engName()) + ' ↔ Exponential</p>'; }
function render(h) { app.innerHTML = h; }

function viewLoading() { render('<div class="spin"></div>'); }
// Wiersze celu (poziomy 1..goal): te same na ekranie startowym i w postępie, wstępnie wyrenderowane, bez przeskoków.
function goalOf() { return cur.goal >= 1 && cur.goal <= 3 ? cur.goal : 3; }
function rowIcon(l) {
  if (l === 3) return '<svg viewBox="0 0 26 26" aria-hidden="true">' + MARKP + '</svg>';
  var ic = cur.engineFound ? safeIcon(cur.engineIcon) : "";
  return ic ? '<img src="' + ic + '" alt="">' : GLYPH_AI;
}
function rowLabel(l) { return l === 1 && cur.engine === "codex" ? T.lvCodex1 : T.lv[l]; }
function rowsHtml() {
  var html = "";
  for (var l = 1; l <= goalOf(); l++) {
    var skip = l === 2 && cur.engine === "codex";
    html += '<li id="rw' + l + '" class="' + (skip ? "skip" : "") + '"><span class="ic"></span><span class="ri">' + rowIcon(l) + '</span><span class="tx">' + esc(rowLabel(l)) + '</span>' +
      (skip ? '<span class="nt">' + esc(T.onlyClaude) + '</span>' : '') + '</li>';
  }
  return '<ul class="steplist" aria-live="polite">' + html + '</ul>';
}
function viewStart() {
  render(pair("") + title() + who(chip()) + rowsHtml() +
    (goalOf() === 3 ? '<label class="chk"><input type="checkbox" id="auto" checked><span class="box"></span>' + esc(T.autostart) + '</label>' : '') +
    '<div class="actions"><button id="b1">' + esc(T.cancel) + '</button><button class="p" id="b2">' + esc(T.go) + '</button></div>');
  document.getElementById("b1").onclick = function () { window.close(); };
  document.getElementById("b2").onclick = function () { var c = document.getElementById("auto"); viewProgress(); window.install(c ? c.checked : false); };
  document.getElementById("b2").focus();
}
function viewProgress() {
  render(pair("run") + rowsHtml());
  setRow(1, "now", "");
}
// state: now | ok | err | skip; note = powód (w podpowiedzi wiersza, przy pominięciu także widoczny)
function setRow(l, state, note) {
  var li = document.getElementById("rw" + l);
  if (!li) return;
  li.className = state === "now" ? "now" : state;
  li.title = state === "err" ? note : "";
  if (state === "skip") return;
}
function viewDone(title, line, warn, tip, extra) {
  render(pair("ok") + '<p class="h">' + esc(title) + '</p>' +
    (line ? '<span class="mut">' + esc(line) + '</span>' : "") +
    (warn ? '<span class="mut warn">' + esc(warn) + '</span>' : "") +
    (tip ? '<span class="mut tip">' + TRAYMARK + esc(tip) + '</span>' : "") +
    (extra ? '<span class="mut">' + esc(extra) + '</span>' : "") +
    '<div class="actions"><button class="p" id="b1">' + esc(T.close) + '</button></div>');
  document.getElementById("b1").onclick = function () { window.close(); };
  document.getElementById("b1").focus();
}
function finish(r) {
  var names = [];
  for (var i = 0; i < r.done.length; i++) names.push(rowLabel(r.done[i]));
  var warn = r.goal === 3 && r.done.indexOf(3) >= 0 && !r.agentSeen ? T.doneWarn : "";
  var tip = r.goal === 3 && r.done.indexOf(3) >= 0 ? T.trayTip : "";
  var doneScreen = function (extra) { viewDone(r.errors ? T.doneErr : T.done, names.join(" · "), warn, tip, extra); };
  setTimeout(function () {
    if (r.errors || cur.engine === "codex" || r.goal !== 3) { doneScreen(""); return; }
    Promise.resolve(window.phoneState()).then(function (st) {
      if (!st || st.codex || !st.accounts || !st.accounts.length) { doneScreen(""); return; }
      viewPhoneQ(doneScreen);
    }, function () { doneScreen(""); });
  }, 700);
}
var phoneTimer = 0, phoneSt = null;
function stopPhonePoll() { if (phoneTimer) { clearInterval(phoneTimer); phoneTimer = 0; } }
function viewPhoneQ(doneScreen) {
  render(pair("ok") + '<p class="h">' + esc(T.phoneQ) + '</p>' +
    '<div class="actions"><button id="b1">' + esc(T.notNow) + '</button><button class="p" id="b2">' + esc(T.yes) + '</button></div>');
  try { window.phoneAsked(); } catch (e) {} // TEMP phone-announce: remove after agent 0.5
  document.getElementById("b1").onclick = function () { doneScreen(""); };
  document.getElementById("b2").onclick = function () { viewPhone(doneScreen); };
  document.getElementById("b2").focus();
}
function phoneListHtml() {
  var projs = phoneSt.projects || [], prep = false;
  if (!phoneSt.account) return "";
  var rows = projs.map(function (p) {
    if (p.on && !p.ready && p.missing !== "folder") prep = true;
    var pill = p.ready ? '<span class="pill good">' + esc(T.phoneReady) + '</span>'
      : '<span class="pill" title="' + esc(T["phone" + p.missing.charAt(0).toUpperCase() + p.missing.slice(1)]) + '">' + esc(T.phoneSetup) + '</span>';
    return '<div class="prow' + (p.on ? " on" : "") + '" data-k="' + esc(p.key) + '" role="switch" tabindex="0" aria-checked="' + p.on + '"><span>' + esc(p.key) + '</span>' + pill + '<i class="sw"></i></div>';
  }).join("");
  return '<div class="plist">' + rows + '</div>' + (prep ? '<button class="sm" id="pprep">' + esc(T.phonePrep) + '</button>' : "");
}
function bindPhoneList() {
  Array.prototype.forEach.call(document.querySelectorAll("[data-k]"), function (el) {
    el.onclick = function () {
      var on = !el.classList.contains("on");
      (phoneSt.projects || []).forEach(function (p) { if (p.key === el.dataset.k) p.on = on; });
      window.setPhoneProject(el.dataset.k, on);
      drawPhoneList();
    };
    el.onkeydown = function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); el.click(); } };
  });
  var b = document.getElementById("pprep");
  if (b) b.onclick = function () { window.preparePhone(); };
}
function drawPhoneList() {
  var box = document.getElementById("plistbox");
  if (!box) return;
  var h = phoneListHtml();
  if (box.dataset.h !== h) { box.dataset.h = h; box.innerHTML = h; bindPhoneList(); }
}
function viewPhone(doneScreen) {
  window.phoneState().then(function (st) {
    phoneSt = st;
    var opts = '<option value="">' + esc(T.phoneNone) + '</option>' + st.accounts.map(function (a) {
      return '<option value="' + esc(a.dir) + '"' + (a.dir === st.account ? " selected" : "") + '>' + esc(a.email) + '</option>';
    }).join("");
    render(pair("ok") + '<p class="h">' + esc(T.phoneQ) + '</p>' +
      '<select class="sel" id="pacc">' + opts + '</select><span class="mut">' + esc(T.phoneHint) + '</span>' +
      '<div id="plistbox" class="tip" style="flex-direction:column"></div>' +
      '<div class="actions"><button class="p" id="b1">' + esc(T.done) + '</button></div>');
    drawPhoneList();
    document.getElementById("pacc").onchange = function () {
      var v = document.getElementById("pacc").value;
      Promise.resolve(window.setPhoneAccount(v)).then(poll, poll);
    };
    document.getElementById("b1").onclick = function () {
      stopPhonePoll();
      doneScreen(phoneSt && phoneSt.account ? T.phoneChange : "");
    };
    stopPhonePoll();
    phoneTimer = setInterval(poll, 2000);
  });
}
function poll() {
  window.phoneState().then(function (st) { phoneSt = st; drawPhoneList(); });
}
 function showError(e) {
  var m = T.err[e.errCode] || T.err.exe, line = m[1];
  if (e.errDetail) line = (line ? line + " " : "") + e.errDetail;
  render(pair("err") + '<p class="h">' + esc(m[0]) + '</p><span class="mut">' + esc(line) + '</span>' +
    '<div class="actions"><button id="b1">' + esc(T.close) + '</button><button class="p" id="b2">' + esc(T.open) + '</button></div>');
  document.getElementById("b1").onclick = function () { window.close(); };
  document.getElementById("b2").onclick = function () { window.openExponential(); };
  document.getElementById("b2").focus();
}
function viewConnected() {
  var on = !!cur.running;
  render(pair("ok") + title() + who(goalOf() === 3 ? '<span class="chip ' + (on ? "on" : "off") + '">' + esc(on ? T.on : T.off) + '</span>' : "") +
